{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Resume Template</title>
    <link rel="stylesheet" href="{% static 'css/choose_tem.css' %}" />
  </head>
  <body>
    <div class="page-shell">
      <div class="header-bar">
        <div class="brand">
          <span class="brand-mark">R</span>
          <span>ResumeMaker</span>
        </div>

        <div class="header-actions">
          <a href="{% url 'dashboard' %}" class="nav-btn">Dashboard</a>
          <a href="{% url 'logout' %}" class="nav-btn">Logout</a>
        </div>
      </div>

      <div class="container">
        <div class="title-wrap">
          <p class="eyebrow">Templates</p>
          <h1>Choose Your Resume Template</h1>
          <p class="subtitle">Select a professional template for your resume</p>
        </div>

        <div class="template-box">
          <div class="card">
            <img src="{% static 'images/template1.jpg' %}" alt="Template 1" />
            <div class="card-body">
              <h3>Modern Resume</h3>
              <a href="{% url 'edit' %}?template=1">
                <button>Select Template</button>
              </a>
            </div>
          </div>

          <div class="card">
            <img src="{% static 'images/template2.jpg' %}" alt="Template 2" />
            <div class="card-body">
              <h3>Professional Resume</h3>
              <a href="{% url 'edit' %}?template=2">
                <button>Select Template</button>
              </a>
            </div>
          </div>

          <div class="card">
            <img src="{% static 'images/template3.jpg' %}" alt="Template 3" />
            <div class="card-body">
              <h3>Creative Resume</h3>
              <a href="{% url 'edit' %}?template=3">
                <button>Select Template</button>
              </a>
            </div>
          </div>

          <div class="card">
            <img src="{% static 'images/template4.jpg' %}" alt="Template 4" />
            <div class="card-body">
              <h3>Simple Resume</h3>
              <a href="{% url 'edit' %}?template=4">
                <button>Select Template</button>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
